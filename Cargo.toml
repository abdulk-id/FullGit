[workspace]
resolver = "3"
members = ["crates/fullgit-core", "crates/fullgit"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# let-chains
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fullgit-core = { path = "crates/fullgit-core" }
age = { version = "0.12", features = ["ssh", "armor"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
tempfile = "3"
thiserror = "2"
